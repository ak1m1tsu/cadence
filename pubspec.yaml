name: tracer
description: "Track your service subscriptions."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.20.3
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.0.0
  timezone: ^0.9.4
  fl_chart: ^0.69.0
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^10.1.9
  flutter_svg: ^2.0.10+1
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
